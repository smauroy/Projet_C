name: Feature
description: Plan a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User need / problem
      description: What should the software do and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed implementation
      description: Which modules or interfaces will be affected?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ... when ... then ...
        - [ ] Tests cover successful and error cases
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 - Critical, P1 - High, P2 - Normal, P3 - Nice to have]
    validations:
      required: true
